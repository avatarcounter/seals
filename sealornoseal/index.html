<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal or Sea Lion?</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #e0f2f1; padding: 20px; }
        #game-container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        #display-img { width: 100%; height: 300px; object-fit: cover; border-radius: 15px; background: #cfd8dc; }
        .btns { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 30px; font-size: 1rem; cursor: pointer; border: none; border-radius: 50px; font-weight: bold; background: #00bcd4; color: white; }
        #leaderboard { margin-top: 25px; text-align: left; padding: 15px; background: #f1f8e9; border-radius: 12px; }
        .entry { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Seal vs Sea Lion</h1>
        <div>Streak: <span id="correct-count">0</span></div>
        <img id="display-img" src="" alt="Loading...">
        <div class="btns">
            <button onclick="check(true)">Seal</button>
            <button onclick="check(false)" style="background:#ff9800">Sea Lion</button>
        </div>
        <div id="feedback" style="height: 20px; margin: 10px 0; font-weight: bold;"></div>
        <div id="leaderboard">
            <h3>🏆 Top Streaks</h3>
            <div id="leaderboard-list">Loading scores...</div>
        </div>
    </div>

<script>
    // 1. YOUR KEYS
    const PUBLIC_KEY = "69f639198f40bb1068bb7e9f";
    const PRIVATE_KEY = "sd5R64xJFk-QcSzJ1xksigJKrrGaD6X0qzcxLnnpa2mw";
 
    // 2. YOUR CLOUDFLARE WORKER URL (Replace with your actual .workers.dev link)
    const MY_PROXY = "https://workers.dev";

    let score = 0;
    let isCorrectSeal = false;
    let gameActive = true;

    async function updateLeaderboardUI() {
        const list = document.getElementById('leaderboard-list');
        // Fix: Added missing slash and correct template literal syntax
        const target = `https://dreamlo.com{PUBLIC_KEY}/json`;
        const proxyUrl = MY_PROXY + encodeURIComponent(target);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Proxy error');
            const data = await response.json();
            
            const entries = data?.dreamlo?.leaderboard?.entry;
            
            if (!entries) {
                list.innerHTML = "No scores yet!";
                return;
            }
            
            const scoreArray = Array.isArray(entries) ? entries : [entries];
            list.innerHTML = scoreArray.slice(0, 5).map(s => `
                <div class="entry"><span>${s.name}</span><strong>${s.score}</strong></div>
            `).join('');
        } catch (err) {
            console.error("Board load failed:", err);
            list.innerHTML = "Leaderboard error.";
        }
    }

    async function saveScore(name, finalScore) {
        const cleanName = encodeURIComponent(name.trim().substring(0, 10));
        // Fix: Added missing slash and correct template literal syntax
        const target = `https://dreamlo.com{PRIVATE_KEY}/add/${cleanName}/${finalScore}`;
        const proxyUrl = MY_PROXY + encodeURIComponent(target);
        
        try {
            await fetch(proxyUrl);
            setTimeout(updateLeaderboardUI, 1000);
        } catch (err) {
            console.error("Save failed:", err);
        }
    }

    function nextRound() {
        gameActive = true;
        document.getElementById('feedback').innerText = "";
        isCorrectSeal = Math.random() < 0.5;
        const folder = isCorrectSeal ? "seal" : "noseal";
        const randomNum = Math.floor(Math.random() * 5) + 1;
        document.getElementById('display-img').src = `${folder}/${randomNum}.jpg`;
    }

    function check(userChoice) {
        if (!gameActive) return;
        gameActive = false;
        const fb = document.getElementById('feedback');
        
        if (userChoice === isCorrectSeal) {
            score++;
            document.getElementById('correct-count').innerText = score;
            fb.innerText = "Correct! 🌊";
            fb.style.color = "green";
            setTimeout(nextRound, 800);
        } else {
            fb.innerText = "Game Over!";
            fb.style.color = "red";
            setTimeout(() => {
                if (score > 0) {
                    const name = prompt(`Streak: ${score}! Enter your name:`);
                    if (name) saveScore(name, score);
                }
                score = 0;
                document.getElementById('correct-count').innerText = 0;
                nextRound();
            }, 1000);
        }
    }

    updateLeaderboardUI();
    nextRound();
</script>

</body>
</html>
