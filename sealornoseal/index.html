<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal or No Seal?</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; margin: 0; padding: 20px; }
        .game-card { background: #ecf0f1; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; color: #333; max-width: 450px; }
        .img-container { width: 400px; height: 300px; margin-bottom: 20px; overflow: hidden; border-radius: 10px; background: #bdc3c7; display: flex; align-items: center; justify-content: center; }
        img { width: 100%; height: 100%; object-fit: cover; }
        .controls { display: flex; gap: 15px; justify-content: center; }
        button { padding: 15px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .seal-btn { background: #3498db; color: white; }
        .noseal-btn { background: #e67e22; color: white; }
        #feedback { margin-top: 20px; font-size: 1.2rem; font-weight: bold; min-height: 1.5em; }
        .score-display { margin-top: 15px; font-size: 1.5rem; color: #2c3e50; font-weight: bold; }
        .leaderboard { margin-top: 30px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 300px; }
        .leaderboard h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #7f8c8d; padding-bottom: 10px; text-align: center; }
        .entry { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <h1>🦭 Global Seal or No Seal?</h1>
    <p>Ear flaps = No Seal. No ears = Seal!</p>

    <div class="game-card">
        <div class="score-display">Streak: <span id="correct-count">0</span></div>
        <div class="img-container">
            <img id="display-img" src="" alt="Loading...">
        </div>
        <div class="controls">
            <button class="seal-btn" onclick="check(true)">SEAL</button>
            <button class="noseal-btn" onclick="check(false)">NO SEAL</button>
        </div>
        <div id="feedback"></div>
    </div>

    <div class="leaderboard">
        <h2>🏆 World Top 5</h2>
        <div id="leaderboard-list">Loading scores...</div>
    </div>

    <script>
        const PUBLIC_KEY = "69f60e2d8f40bb1068b944a4";
        const TOTAL_SEALS = 5;    
        const TOTAL_NOSEALS = 5;  
        const EXTENSION = "jpg";  

        let isCorrectSeal = false;
        let score = 0;
        let gameActive = true;

        async function updateLeaderboardUI() {
            const list = document.getElementById('leaderboard-list');
            try {
                const response = await fetch(`https://dreamlo.com{PUBLIC_KEY}/json`);
                const data = await response.json();
                
                if (!data || !data.dreamlo || !data.dreamlo.leaderboard || !data.dreamlo.leaderboard.entry) {
                    list.innerText = "Be the first to score!";
                    return;
                }

                let entries = data.dreamlo.leaderboard.entry;
                if (!Array.isArray(entries)) entries = [entries];

                list.innerHTML = entries.slice(0, 5).map(s => `
                    <div class="entry">
                        <span>${s.name}</span>
                        <span><strong>${s.score}</strong></span>
                    </div>
                `).join('');
            } catch (e) {
                list.innerText = "Error loading leaderboard.";
            }
        }

        function saveScore(name, finalScore) {
            const cleanName = name.replace(/\s+/g, '').substring(0, 12);
            fetch('/.netlify/functions/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: cleanName, score: finalScore })
            })
            .then(() => setTimeout(updateLeaderboardUI, 1200))
            .catch(err => console.error("Save error:", err));
        }

        function nextRound() {
            gameActive = true;
            const feedback = document.getElementById('feedback');
            const imgElement = document.getElementById('display-img');
            feedback.innerText = "";
            isCorrectSeal = Math.random() < 0.5;
            const folder = isCorrectSeal ? "seal" : "noseal";
            const max = isCorrectSeal ? TOTAL_SEALS : TOTAL_NOSEALS;
            const randomNum = Math.floor(Math.random() * max) + 1;
            imgElement.src = `${folder}/${randomNum}.${EXTENSION}`;
        }

        function check(userChoice) {
            if (!gameActive) return;
            gameActive = false;
            const feedback = document.getElementById('feedback');
            const scoreDisplay = document.getElementById('correct-count');
            
            if (userChoice === isCorrectSeal) {
                score++;
                scoreDisplay.innerText = score;
                feedback.innerText = "Correct! 🌊";
                feedback.style.color = "#27ae60";
                setTimeout(nextRound, 1000);
            } else {
                feedback.innerText = `Game Over! That was a ${isCorrectSeal ? "Seal" : "Sea Lion"}.`;
                feedback.style.color = "#c0392b";
                setTimeout(() => {
                    if (score > 0) {
                        const name = prompt(`Streak: ${score}! Name for leaderboard:`);
                        if (name && name.trim()) saveScore(name, score);
                    }
                    score = 0;
                    scoreDisplay.innerText = 0;
                    nextRound();
                }, 1000);
            }
        }

        updateLeaderboardUI();
        nextRound();
    </script>
</body>
</html>
