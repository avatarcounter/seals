<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal or Sea Lion?</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f7f9; }
        #game-container { max-width: 500px; margin: 20px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        img { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; background: #ddd; }
        .btns { margin: 20px 0; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; margin: 0 10px; transition: 0.2s; }
        .btn-seal { background: #3498db; color: white; }
        .btn-lion { background: #e67e22; color: white; }
        button:hover { opacity: 0.8; transform: scale(1.05); }
        #leaderboard { margin-top: 30px; text-align: left; padding: 15px; background: #ecf0f1; border-radius: 10px; }
        .entry { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #bdc3c7; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Seal or Sea Lion?</h1>
        <p>Current Streak: <span id="correct-count">0</span></p>
        
        <img id="display-img" src="" alt="Loading animal...">
        
        <div class="btns">
            <button class="btn-seal" onclick="check(true)">Seal</button>
            <button class="btn-lion" onclick="check(false)">Sea Lion</button>
        </div>

        <div id="feedback"></div>

        <div id="leaderboard">
            <h3>🏆 Global Top 5</h3>
            <div id="leaderboard-list">Loading scores...</div>
        </div>
    </div>

<script>
    // YOUR KEYS
    const PUBLIC_KEY = "69f60e2d8f40bb1068b944a4";
    const PRIVATE_KEY = "waBsY9hwf0urcEpwwn8rLw1Z2xYyPvZEqGdwAay68VqQ"; 
    
    let score = 0;
    let isCorrectSeal = false;
    let gameActive = true;

    // FIX: Use fetch with AllOrigins to bypass HTTP/SSL issues
    async function updateLeaderboardUI() {
        const list = document.getElementById('leaderboard-list');
        const target = `http://dreamlo.com{PUBLIC_KEY}/json`;
        
        try {
            const response = await fetch(`https://allorigins.win{encodeURIComponent(target)}`);
            const data = await response.json();
            const dreamloData = JSON.parse(data.contents);
            let entries = dreamloData?.dreamlo?.leaderboard?.entry;
            
            if (!entries) {
                list.innerHTML = "No scores yet!";
                return;
            }
            
            const scoreArray = Array.isArray(entries) ? entries : [entries];
            list.innerHTML = scoreArray.slice(0, 5).map(s => `
                <div class="entry"><span>${s.name}</span><span><strong>${s.score}</strong></span></div>
            `).join('');
        } catch (err) {
            list.innerHTML = "Leaderboard error.";
        }
    }

    // FIX: Send the save request through the proxy
    async function saveScore(name, finalScore) {
        const cleanName = encodeURIComponent(name.trim().substring(0, 12));
        const target = `http://dreamlo.com{PRIVATE_KEY}/add/${cleanName}/${finalScore}`;
        
        await fetch(`https://allorigins.win{encodeURIComponent(target)}`);
        setTimeout(updateLeaderboardUI, 1000);
    }

    function nextRound() {
        gameActive = true;
        document.getElementById('feedback').innerText = "";
        const img = document.getElementById('display-img');
        isCorrectSeal = Math.random() < 0.5;
        
        // Randomly pick an image 1-5 from your folders
        const folder = isCorrectSeal ? "seal" : "noseal";
        const randNum = Math.floor(Math.random() * 5) + 1;
        img.src = `${folder}/${randNum}.jpg`;
    }

    function check(userChoice) {
        if (!gameActive) return;
        gameActive = false;
        const feedback = document.getElementById('feedback');

        if (userChoice === isCorrectSeal) {
            score++;
            document.getElementById('correct-count').innerText = score;
            feedback.innerText = "Correct! 🌊";
            feedback.style.color = "#27ae60";
            setTimeout(nextRound, 1000);
        } else {
            feedback.innerText = `Game Over! That was a ${isCorrectSeal ? "Seal" : "Sea Lion"}.`;
            feedback.style.color = "#c0392b";
            
            setTimeout(() => {
                if (score > 0) {
                    const name = prompt(`Streak: ${score}! Enter name:`);
                    if (name) saveScore(name, score);
                }
                score = 0;
                document.getElementById('correct-count').innerText = 0;
                nextRound();
            }, 1200);
        }
    }

    // Initial load
    updateLeaderboardUI();
    nextRound();
</script>
</body>
</html>
