<script>
    // --- CONFIGURATION ---
    const TOTAL_SEALS = 5;    
    const TOTAL_NOSEALS = 5;  
    const EXTENSION = "jpg";  
    // ---------------------

    let isCorrectSeal = false;
    let score = 0;
    let gameActive = true;

    // 1. FETCH GLOBAL SCORES (via your get-scores function)
    async function updateLeaderboardUI() {
        const list = document.getElementById('leaderboard-list');
        try {
            // This calls your own server-side function to avoid SSL errors
            const response = await fetch('/.netlify/functions/get-scores');
            const data = await response.json();
            
            if (!data?.dreamlo?.leaderboard?.entry) {
                list.innerText = "Be the first to score!";
                return;
            }

            let entries = data.dreamlo.leaderboard.entry;
            if (!Array.isArray(entries)) entries = [entries];

            list.innerHTML = entries.slice(0, 5).map(s => `
                <div class="entry">
                    <span>${s.name}</span>
                    <span><strong>${s.score}</strong></span>
                </div>
            `).join('');
        } catch (e) {
            list.innerText = "Leaderboard currently offline.";
            console.error("Leaderboard Error:", e);
        }
    }

    // 2. SAVE SCORE (via your save-score function)
    function saveScore(name, finalScore) {
        const cleanName = name.replace(/\s+/g, '').substring(0, 12);
        
        fetch('/.netlify/functions/save-score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: cleanName, score: finalScore })
        })
        .then(() => {
            // Refresh the list after a short delay
            setTimeout(updateLeaderboardUI, 1500);
        })
        .catch(err => console.error("Save error:", err));
    }

    // 3. GAME LOGIC
    function nextRound() {
        gameActive = true;
        const feedback = document.getElementById('feedback');
        const imgElement = document.getElementById('display-img');
        feedback.innerText = "";
        
        isCorrectSeal = Math.random() < 0.5;
        const folder = isCorrectSeal ? "seal" : "noseal";
        const max = isCorrectSeal ? TOTAL_SEALS : TOTAL_NOSEALS;
        const randomNum = Math.floor(Math.random() * max) + 1;
        
        // Uses your 1.jpg, 2.jpg naming pattern
        imgElement.src = `${folder}/${randomNum}.${EXTENSION}`;
    }

    function check(userChoice) {
        if (!gameActive) return;
        gameActive = false;

        const feedback = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('correct-count');
        
        if (userChoice === isCorrectSeal) {
            score++;
            scoreDisplay.innerText = score;
            feedback.innerText = "Correct! 🌊";
            feedback.style.color = "#27ae60";
            setTimeout(nextRound, 1000);
        } else {
            feedback.innerText = `Game Over! That was a ${isCorrectSeal ? "Seal" : "Sea Lion"}.`;
            feedback.style.color = "#c0392b";
            
            setTimeout(() => {
                if (score > 0) {
                    const name = prompt(`Streak: ${score}! Name for leaderboard:`);
                    if (name && name.trim()) saveScore(name, score);
                }
                score = 0;
                scoreDisplay.innerText = 0;
                nextRound();
            }, 1000);
        }
    }

    // Initialise on load
    updateLeaderboardUI();
    nextRound();
</script>
