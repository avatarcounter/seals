<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal or Sea Lion?</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #e0f2f1; padding: 20px; }
        #game-container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #display-img { width: 100%; height: 280px; object-fit: cover; border-radius: 10px; background: #eee; }
        .btns { margin: 20px 0; }
        button { padding: 12px 25px; font-size: 1rem; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; background: #00bcd4; color: white; margin: 0 5px; }
        #leaderboard { margin-top: 25px; text-align: left; padding: 15px; background: #f9f9f9; border-radius: 10px; border: 1px solid #ddd; }
        .entry { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Seal vs Sea Lion</h1>
        <p>Streak: <strong id="correct-count">0</strong></p>
        <img id="display-img" src="" alt="Loading...">
        <div class="btns">
            <button onclick="check(true)">SEAL</button>
            <button onclick="check(false)" style="background:#ff9800">SEA LION</button>
        </div>
        <div id="feedback"></div>
        <div id="leaderboard">
            <strong>🏆 Top Streaks</strong>
            <div id="leaderboard-list">Loading scores...</div>
        </div>
    </div>

<script>
    const PUBLIC_KEY = "69f639198f40bb1068bb7e9f";
    const PRIVATE_KEY = "sd5R64xJFk-QcSzJ1xksigJKrrGaD6X0qzcxLnnpa2mw";
 
    let score = 0;
    let isCorrectSeal = false;
    let gameActive = true;

    // NEW: Using Corsproxy.io - much simpler and more reliable
    async function updateLeaderboardUI() {
        const list = document.getElementById('leaderboard-list');
        const targetUrl = `http://dreamlo.com{PUBLIC_KEY}/json`;
        const proxyUrl = `https://corsproxy.io{encodeURIComponent(targetUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            const data = await response.json();
            const entries = data?.dreamlo?.leaderboard?.entry;
            
            if (!entries) {
                list.innerHTML = "No scores yet!";
                return;
            }
            
            const scoreArray = Array.isArray(entries) ? entries : [entries];
            list.innerHTML = scoreArray.slice(0, 5).map(s => `
                <div class="entry"><span>${s.name}</span><strong>${s.score}</strong></div>
            `).join('');
        } catch (err) {
            console.error(err);
            list.innerHTML = "Leaderboard error. Try refreshing.";
        }
    }

    async function saveScore(name, finalScore) {
        const cleanName = encodeURIComponent(name.trim().substring(0, 10));
        const targetUrl = `http://dreamlo.com{PRIVATE_KEY}/add/${cleanName}/${finalScore}`;
        await fetch(`https://corsproxy.io{encodeURIComponent(targetUrl)}`);
        setTimeout(updateLeaderboardUI, 1500);
    }

    function nextRound() {
        gameActive = true;
        document.getElementById('feedback').innerText = "";
        isCorrectSeal = Math.random() < 0.5;
        const folder = isCorrectSeal ? "seal" : "noseal";
        document.getElementById('display-img').src = `${folder}/${Math.floor(Math.random() * 5) + 1}.jpg`;
    }

    function check(userChoice) {
        if (!gameActive) return;
        gameActive = false;
        if (userChoice === isCorrectSeal) {
            score++;
            document.getElementById('correct-count').innerText = score;
            setTimeout(nextRound, 800);
        } else {
            document.getElementById('feedback').innerText = "Wrong!";
            setTimeout(() => {
                if (score > 0) {
                    const name = prompt(`Streak: ${score}! Name:`);
                    if (name) saveScore(name, score);
                }
                score = 0;
                document.getElementById('correct-count').innerText = 0;
                nextRound();
            }, 1000);
        }
    }

    updateLeaderboardUI();
    nextRound();
</script>
</body>
</html>
