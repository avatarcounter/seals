<!DOCTYPE html>
<html>
<head>
    <title>24</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .number {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container" id="container"></div>

<script>
    const container = document.getElementById('container');

function addNumbers(count) {
    // Creating elements individually is much faster for the browser
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = 'number';
        div.textContent = '24';
        fragment.appendChild(div);
    }
    container.appendChild(fragment);
}

// Initial heavy load to ensure a deep scroll well
addNumbers(500);

window.addEventListener('scroll', () => {
    // Trigger much earlier (1000px from bottom) to ensure seamless loading
    const scrollBottom = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
    
    if (scrollBottom < 1000) {
        addNumbers(100);
    }
});
</script>

</body>
</html>
