<!DOCTYPE html>
<html>
 <script>
  (function() {
    // List of blocked names
    const banned = ["ethan", "logan", "teilo"];
    
    // Check if they are already flagged
    let blockedName = localStorage.getItem('isBlockedName');
    
    if (blockedName) {
        renderBlockedPage(blockedName);
        return;
    }

    if (!localStorage.getItem('userName')) {
        const name = prompt("Please enter your name to access the site:");
        const cleanName = name ? name.toLowerCase().trim() : "";
        
        if (banned.includes(cleanName)) {
            // Save the specific name they used to block them forever
            localStorage.setItem('isBlockedName', cleanName);
            renderBlockedPage(cleanName);
        } else {
            // Let them in and remember them so they aren't asked again
            localStorage.setItem('userName', cleanName || "guest");
        }
    }

    function renderBlockedPage(name) {
        // Capitalise first letter for the display (e.g., "Logan Blocked")
        const displayName = name.charAt(0).toUpperCase() + name.slice(1);
        
        document.documentElement.innerHTML = `
            <style>
                body { 
                    background-color: black; 
                    display: flex; 
                    justify-content: center; 
                    align-items: center; 
                    height: 100vh; 
                    margin: 0; 
                    overflow: hidden;
                }
                h1 {
                    font-size: 8vw;
                    font-family: sans-serif;
                    font-weight: bold;
                    text-transform: uppercase;
                    text-align: center;
                    animation: flash 0.2s infinite;
                }
                @keyframes flash {
                    0% { color: red; }
                    50% { color: blue; }
                    100% { color: red; }
                }
            </style>
            <h1>\${displayName} Blocked</h1>
        `;
        window.stop();
    }
  })();
</script>


<head>
    <title>24</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .number {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container" id="container"></div>

<script>
    const container = document.getElementById('container');

function addNumbers(count) {
    // Creating elements individually is much faster for the browser
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = 'number';
        div.textContent = '24';
        fragment.appendChild(div);
    }
    container.appendChild(fragment);
}

// Initial heavy load to ensure a deep scroll well
addNumbers(500);

window.addEventListener('scroll', () => {
    // Trigger much earlier (1000px from bottom) to ensure seamless loading
    const scrollBottom = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
    
    if (scrollBottom < 1000) {
        addNumbers(100);
    }
});
</script>

</body>
</html>
