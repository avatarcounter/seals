    const secretSection = document.getElementById('secretSection');
    
    const routes = {
      '+4': 'https://seal.motorcycles/magic',
      '24': 'https://seal.motorcycles/24',
      'tetris': 'https://seal.motorcycles/tetris',
      'beast' : 'https://seal.motorcycles/ihatebeast',
      'world' : 'https://goodbyetoa.world',
      'word' : 'https://seal.motorcycles/sealmotorcycles'
    };

    dialogueInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const val = dialogueInput.value.trim();
        

        if (val === '777') {
          secretSection.style.display = 'block';
          secretSection.scrollIntoView({ behavior: 'smooth' });
        } else if (routes[val.toLowerCase()]) {
          window.location.href = routes[val.toLowerCase()];
        }
        
        dialogueInput.value = '';
      }
    });
  </script>
