<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I LOVE SEALS</title>
  <meta property="og:image" content="https://githubusercontent.com">
  <meta property="og:description" content="seals are so cool...">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      margin: 0;
      padding: 40px 20px;
    }
    img, video, embed {
      max-width: 100%;
      border-radius: 12px;
      margin: 20px 0;
    }
    .button-container {
      margin: 30px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .dialogue-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      width: 300px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }
    .dialogue-box input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    blockquote {
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>

  <h1><strong>seal below</strong></h1>

  <div class="button-container">
    <a href="https://seal.motorcycles">
      <button>Bring Me Tsuki</button>
    </a>
  </div>

  <p>Literal mold spore</p>
  <img src="/seal.png" alt="Seal Image">

  <p>sealutations!</p>
  <img src="/sealutations.gif" alt="Sealutations">

  <div>
    <video src="seal.mp4" controls width="320">
      Your browser doesn't support HTML video. 
      <a href="seal.mp4">Link to video</a>
    </video>
  </div>

  <div>
    <img src="/seal.gif" width="250" alt="Seal Animation">
  </div>

  <blockquote>"seals are awesome"</blockquote>
  <p>so cool...</p>
  <p><strong><small>seal</small></strong></p>

  <!-- Dialogue Box -->
  <div class="dialogue-box">
    <input type="text" id="dialogueInput" placeholder="Type secret code here..." autocomplete="off">
  </div>

  <script>
    const dialogueInput = document.getElementById('dialogueInput');
    const routes = {
      '+4': 'https://seal.motorcycles',
      '24': 'https://seal.motorcycles',
      'tetris': 'https://seal.motorcycles'
    };

    dialogueInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        const code = dialogueInput.value.trim().toLowerCase();
        if (routes[code]) {
          window.location.href = routes[code];
        }
        dialogueInput.value = ''; 
      }
    });
  </script>

</body>
</html>
