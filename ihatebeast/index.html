<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>I hate beast</title>
    <meta property="og:description" content="I hate beast you 0sta">
    <meta name="description" content="I hate beast you 0sta">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .content {
            font-size: clamp(30px, 8vw, 70px);
            font-weight: 900;
            color: #00FF00;
            text-shadow: 0 0 20px #00FF00;
            text-align: center;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        .rating-box {
            background: #0a0a0a;
            padding: 40px;
            border-radius: 5px;
            border: 3px solid #FF0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 25px;
        }
        .stars input {
            display: none;
        }
        .stars label {
            font-size: 50px;
            color: #220000;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #FF0000;
            text-shadow: 0 0 15px #FF0000;
            transform: scale(1.1);
        }

        @keyframes flashBorder {
            0% { border-color: #FF0000; box-shadow: 0 0 15px #FF0000; }
            50% { border-color: #00FF00; box-shadow: 0 0 15px #00FF00; }
            100% { border-color: #FF0000; box-shadow: 0 0 15px #FF0000; }
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 25px;
            padding: 15px;
            background: #000;
            color: #00FF00;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            border: 4px solid #FF0000;
            animation: flashBorder 0.5s infinite;
        }

        textarea::placeholder {
            color: #333;
        }

        .progress-container {
            width: 100%;
            height: 20px;
            background: #1a1a1a;
            border: 2px solid #FF0000;
            margin-bottom: 25px;
            display: none;
            position: relative;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00FF00;
            box-shadow: 0 0 10px #00FF00;
            transition: width 0.1s linear;
        }

        #submit-btn {
            width: 100%;
            padding: 18px;
            background-color: #FF0000;
            color: #000;
            border: none;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        #submit-btn:hover:not(:disabled) {
            background-color: #00FF00;
            box-shadow: 0 0 30px #00FF00;
        }
        #submit-btn:disabled {
            background-color: #1a1a1a;
            color: #333;
            cursor: not-allowed;
            animation: none;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #00FF00;
        }
    </style>
</head>
<body>

<div class="content">I hate beast</div>

<div class="rating-box">
    <div class="stars">
        <input type="radio" name="rate" id="s5" value="5"><label for="s5">★</label>
        <input type="radio" name="rate" id="s4" value="4"><label for="s4">★</label>
        <input type="radio" name="rate" id="s3" value="3"><label for="s3">★</label>
        <input type="radio" name="rate" id="s2" value="2"><label for="s2">★</label>
        <input type="radio" name="rate" id="s1" value="1"><label for="s1">★</label>
    </div>
    <textarea id="comment" placeholder="LOG YOUR HATRED..."></textarea>
    
    <div class="progress-container" id="prog-cont">
        <div class="progress-bar" id="prog-bar"></div>
    </div>

    <button id="submit-btn">Transmit Hate</button>
    <div id="status"></div>
</div>

<script>
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');
    const commentBox = document.getElementById('comment');
    const progCont = document.getElementById('prog-cont');
    const progBar = document.getElementById('prog-bar');

    // GOOGLE FORM CONFIG
    const FORM_URL = "https://google.com";
    const ENTRY_RATING = "entry.1706691456"; 
    const ENTRY_COMMENT = "entry.317578274"; 

    btn.addEventListener('click', () => {
        const rating = document.querySelector('input[name="rate"]:checked');
        
        // Ensure both fields are filled
        if (!rating || !commentBox.value.trim()) {
            status.innerText = "ERROR: RATING & LOG REQUIRED";
            status.style.color = "#FF0000";
            return;
        }

        btn.disabled = true;
        progCont.style.display = "block";
        status.style.color = "#00FF00";
        status.innerText = "BYPASSING SECURITY...";

        const formData = new FormData();
        formData.append(ENTRY_RATING, rating.value);
        formData.append(ENTRY_COMMENT, commentBox.value);

        let width = 0;
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                
                // Submit to Google
                fetch(FORM_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                })
                .then(() => {
                    status.innerText = "HATE SENT TO BEAST'S HOME";
                    commentBox.value = "";
                    document.querySelectorAll('input[name="rate"]').forEach(el => el.checked = false);
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        progCont.style.display = "none";
                        progBar.style.width = "0%";
                    }, 4000);
                })
                .catch(() => {
                    status.innerText = "CRITICAL ERROR: UPLINK FAILED";
                    status.style.color = "#FF0000";
                    btn.disabled = false;
                });

            } else {
                width += Math.random() * 8; 
                if (width > 100) width = 100;
                progBar.style.width = width + "%";
                
                if (width > 30) status.innerText = "ENCRYPTING DATA...";
                if (width > 60) status.innerText = "UPLOADING HATE PACKETS...";
                if (width > 90) status.innerText = "FINALIZING TRANSMISSION...";
            }
        }, 120);
    });
</script>

</body>
</html>
